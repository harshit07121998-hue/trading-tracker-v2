name: Apply Open Positions UI

on:
  push:
    branches: [feature/nifty500-selector]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nifty500-selector
          fetch-depth: 0

      - name: Apply replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('lib/main.dart')
          replacement = Path('lib/open_positions_replacement.txt').read_text()
          text = main.read_text()
          start = text.index('class OpenPositionsScreen extends StatefulWidget {')
          end = text.index('class PortfolioBreakdownScreen extends StatelessWidget {')
          main.write_text(text[:start] + replacement + '\n\n' + text[end:])
          PY

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git rm lib/open_positions_replacement.txt .github/workflows/apply-open-positions-ui.yml
          git commit -m "Redesign open positions UI"
          git push origin feature/nifty500-selector
